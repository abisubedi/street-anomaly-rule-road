<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="Street Anomaly: every town has one strange rule. Live by it, find the catch, learn the lesson.">
<title>Rule Road</title>
<meta name="theme-color" content="#14213D">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rule Road">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="Rule Road by Street Anomaly">
<meta property="og:description" content="Every town has one strange rule. Live by it, find the catch, learn the lesson.">
<meta property="og:image" content="https://streetanomaly.pages.dev/icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width night street. The road runs down the page; each town is a yellow sign on a pole. */
:root {
  color-scheme: dark;
  --night: #14213D;        /* brand night navy */
  --night-deep: #0B1428;
  --asphalt: #1C2A4A;
  --line: #2D3D63;
  --sign: #FFD23F;         /* street-sign yellow */
  --sign-ink: #14130C;
  --gold: #E9B949;         /* coin gold */
  --red: #E63946;          /* warning red */
  --leaf: #7BD389;         /* life-town green, sits beside the yellow */
  --fg: #EEF1F8;
  --muted: #9AA7C4;
  --card: #18264A;
  /* type roles: Bungee is a signage face, for signs and town names; Fredoka's round shapes mark what you can tap;
     Atkinson Hyperlegible Next is built for legibility, for everything you read; its Mono keeps numbers steady */
  --font-display: "Bungee", "Arial Black", Impact, sans-serif;
  --font-sign: "Fredoka", "Trebuchet MS", "Avenir Next", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
  --font-num: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ts: 1;                 /* text size setting: 1, 1.15 or 1.3 */
  --press: #0A1226;        /* keycap edge under pressable things */
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, a, input { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  background:
    radial-gradient(60% 30% at 15% 0%, rgba(255,210,63,.10), transparent 70%),
    radial-gradient(50% 25% at 90% 35%, rgba(255,210,63,.06), transparent 70%),
    var(--night-deep);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 19px; font-size: calc(var(--ts) * 19px);
  line-height: 1.5;
}
.app {
  max-width: 520px; margin: 0 auto; min-height: 100%;
  padding-left: 16px; padding-right: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  display: flex; flex-direction: column; gap: 18px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--sign); outline-offset: 3px; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-sign); font-weight: 900; letter-spacing: .14em; font-size: 14px; font-size: calc(var(--ts) * 14px); text-transform: uppercase; color: var(--muted); }
.brand b { color: var(--sign); }
.iconbtn { white-space: nowrap; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-size: calc(var(--ts) * 14px); color: var(--muted); }
.iconbtn:hover { color: var(--fg); border-color: var(--muted); }

/* the sign: core visual */
.sign {
  background: var(--sign); color: var(--sign-ink);
  border-radius: 14px; padding: 6px;
  box-shadow: 0 0 0 3px var(--sign-ink) inset, 0 18px 40px -12px rgba(255,210,63,.35);
}
.sign-inner { border: 3px solid var(--sign-ink); border-radius: 9px; padding: 16px 18px 18px; }
.sign .kicker { font-family: var(--font-sign); font-weight: 900; font-size: 14px; font-size: calc(var(--ts) * 14px); letter-spacing: .22em; text-transform: uppercase; }
.sign .rule { font-family: var(--font-sign); font-weight: 900; font-size: 28px; font-size: calc(var(--ts) * clamp(26px, 7vw, 34px)); line-height: 1.04; text-transform: uppercase; text-wrap: balance; margin-top: 6px; }
.pole { width: 14px; height: 34px; margin: 0 auto; background: linear-gradient(90deg, #5B6680, #A8B2C8 45%, #5B6680); }

/* home */
.hero { display: flex; flex-direction: column; gap: 0; padding-top: 6px; }
.hero .sign { transform-origin: 50% 0; animation: swing 1.6s cubic-bezier(.3,1.6,.5,1) both; }
.hero .rule { font-size: 44px; font-size: calc(var(--ts) * clamp(40px, 12vw, 58px)); }
.hero .rule .flicker { animation: flicker 6s infinite; }
.hero p { margin: 14px 0 0; color: var(--muted); font-size: 17px; font-size: calc(var(--ts) * 17px); }
.howto { color: var(--muted); font-size: 16px; font-size: calc(var(--ts) * 16px); margin: 0; text-wrap: pretty; }
.howto strong { color: var(--fg); }

.road { position: relative; display: flex; flex-direction: column; gap: 14px; padding-block: 8px; }
.road::before {
  content: ""; position: absolute; left: 27px; top: 0; bottom: 0; width: 4px;
  background: repeating-linear-gradient(to bottom, var(--sign) 0 18px, transparent 18px 34px); opacity: .55;
}
.stop {
  position: relative; display: grid; grid-template-columns: 58px 1fr; gap: 12px; align-items: center;
  text-align: left; background: transparent; border: 0; padding: 0;
}
.mile {
  width: 58px; height: 58px; border-radius: 10px; background: var(--night); border: 2px solid var(--line);
  display: grid; place-items: center; text-align: center; z-index: 1;
  font-family: var(--font-display); font-weight: 400; line-height: 1;
}
.mile small { display: block; font-size: 14px; font-size: calc(var(--ts) * 14px); letter-spacing: .16em; color: var(--muted); }
.mile span { font-size: 23px; font-size: calc(var(--ts) * 23px); }
.stop-card {
  min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, transform .15s;
}
.stop:hover .stop-card { border-color: var(--sign); transform: translateX(3px); }
.stop .tags { display: flex; gap: 8px; align-items: center; font-size: 14px; font-size: calc(var(--ts) * 14px); font-family: var(--font-sign); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.tag-money { color: var(--gold); }
.tag-life { color: var(--leaf); }
.stop .tname { font-family: var(--font-display); font-weight: 400; letter-spacing: .02em; font-size: 21px; font-size: calc(var(--ts) * 21px); line-height: 1.1; }
.stop .trule { color: var(--muted); font-size: 16px; font-size: calc(var(--ts) * 16px); line-height: 1.35; }
.stars { margin-left: auto; letter-spacing: 2px; color: var(--sign); font-size: 15px; font-size: calc(var(--ts) * 15px); }
.stars .off { color: var(--line); }
.stop.done .mile { border-color: var(--sign); color: var(--sign); }
.stop.yours .mile { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); }
.total { font-family: var(--font-sign); font-weight: 700; font-size: 15px; font-size: calc(var(--ts) * 15px); color: var(--muted); letter-spacing: .06em; }
.total b { color: var(--sign); font-family: var(--font-num); }

/* town screen */
.meters { display: flex; flex-wrap: wrap; gap: 10px; }
.meter {
  flex: 1 1 140px; min-width: 0; background: var(--night); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 6px;
}
.meter .ml { font-size: 14px; font-size: calc(var(--ts) * 14px); font-family: var(--font-sign); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.meter .mv { font-family: var(--font-num); font-size: 32px; font-size: calc(var(--ts) * 32px); line-height: 1; font-variant-numeric: tabular-nums; color: var(--gold); }
.meter.life .mv { color: var(--leaf); }
.meter .mv.bump { animation: bump .45s ease; }
.meter .mv.drop { animation: drop .45s ease; color: var(--red); }
.track { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.track i { display: block; height: 100%; background: currentColor; border-radius: 99px; transition: width .5s ease; }
.meter .track { color: var(--gold); }
.meter.life .track { color: var(--leaf); }
.meter.low .track, .meter.low .mv { color: var(--red); }

.mini-sign { display: inline-flex; align-self: flex-start; gap: 8px; align-items: center; background: var(--sign); color: var(--sign-ink); border-radius: 6px; padding: 4px 10px; font-family: var(--font-sign); font-weight: 900; font-size: 14px; font-size: calc(var(--ts) * 14px); letter-spacing: .14em; text-transform: uppercase; }
.scene { display: flex; flex-direction: column; gap: 14px; animation: rise .35s ease both; }
.when { font-family: var(--font-sign); font-weight: 900; font-size: 14px; font-size: calc(var(--ts) * 14px); letter-spacing: .2em; text-transform: uppercase; color: var(--sign); }
.story { font-size: 21px; font-size: calc(var(--ts) * 21px); line-height: 1.4; margin: 0; text-wrap: pretty; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice {
  text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px;
  display: flex; gap: 12px; align-items: center; justify-content: space-between; transition: border-color .12s, background .12s;
}
.choice:hover:not(:disabled) { border-color: var(--sign); background: #1E2E57; }
.choice:disabled { opacity: .42; cursor: not-allowed; }
.choice .cost { flex: none; font-family: var(--font-num); font-size: 14px; font-size: calc(var(--ts) * 14px); color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 2px 8px; white-space: nowrap; }
.result { background: var(--night); border-left: 4px solid var(--sign); border-radius: 0 12px 12px 0; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; animation: rise .3s ease both; }
.result p { margin: 0; }
.result .night { color: var(--muted); font-style: italic; }
.result .night strong { color: var(--gold); font-style: normal; font-family: var(--font-num); }
.go {
  align-self: stretch; background: var(--sign); color: var(--sign-ink); border: 0; border-radius: 12px; padding: 15px 18px;
  font-family: var(--font-sign); font-weight: 900; font-size: 19px; font-size: calc(var(--ts) * 19px); letter-spacing: .1em; text-transform: uppercase;
}
.go:hover { filter: brightness(1.06); }
.go.ghost { background: transparent; color: var(--fg); border: 2px solid var(--line); }
.go.ghost:hover { border-color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 160px; }

/* rehook: the pattern interrupt */
.rehook { background: var(--red); color: #fff; border-radius: 14px; padding: 22px 20px; display: flex; flex-direction: column; gap: 10px; animation: shake .5s ease both; }
.rehook .k { font-family: var(--font-sign); font-weight: 900; font-size: 14px; font-size: calc(var(--ts) * 14px); letter-spacing: .2em; text-transform: uppercase; opacity: .85; }
.rehook p { margin: 0; font-size: 21px; font-size: calc(var(--ts) * 21px); line-height: 1.35; font-weight: 700; text-wrap: pretty; }

/* ending */
.end-stars { font-size: 46px; font-size: calc(var(--ts) * 46px); letter-spacing: 8px; color: var(--sign); text-align: center; line-height: 1; }
.end-stars .off { color: var(--line); }
.end-stars span { display: inline-block; animation: pop .5s cubic-bezier(.3,1.8,.5,1) both; }
.end-stars span:nth-child(2) { animation-delay: .15s; } .end-stars span:nth-child(3) { animation-delay: .3s; }
.lesson { text-align: center; font-family: var(--font-sign); font-weight: 900; font-size: 26px; font-size: calc(var(--ts) * clamp(24px, 6.5vw, 30px)); line-height: 1.12; color: var(--sign); text-wrap: balance; margin: 0; }
.lesson-k { text-align: center; font-size: 14px; font-size: calc(var(--ts) * 14px); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-family: var(--font-sign); font-weight: 700; }
.cta { text-align: center; color: var(--fg); margin: 0; font-size: 19px; font-size: calc(var(--ts) * 19px); }
.loop { color: var(--muted); text-align: center; font-style: italic; margin: 0; }

/* your town */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; font-size: calc(var(--ts) * 14px); color: var(--muted); font-family: var(--font-sign); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.field input { background: var(--night); color: var(--fg); border: 2px solid var(--line); border-radius: 10px; padding: 12px 14px; font: inherit; width: 100%; }
.copybox { background: var(--night); border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; font-size: 16px; font-size: calc(var(--ts) * 16px); color: var(--muted); user-select: all; white-space: pre-wrap; overflow-wrap: anywhere; }
.install { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.install img { width: 44px; height: 44px; border-radius: 10px; flex: none; }
.install div { flex: 1; min-width: 0; font-size: 15px; font-size: calc(var(--ts) * 15px); color: var(--muted); line-height: 1.35; }
.install div strong { color: var(--fg); display: block; font-size: 16px; font-size: calc(var(--ts) * 16px); }
.install .go { flex: none; align-self: center; padding: 10px 14px; font-size: 15px; font-size: calc(var(--ts) * 15px); }
.toggles { display: flex; gap: 8px; }
.listen-row { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 15px; font-size: calc(var(--ts) * 15px); }
.listen-row.center { justify-content: center; }
.listen { flex: none; background: transparent; color: var(--sign); border: 1.5px solid var(--sign); border-radius: 999px; padding: 6px 14px; font-family: var(--font-sign); font-weight: 900; font-size: 14px; font-size: calc(var(--ts) * 14px); letter-spacing: .1em; text-transform: uppercase; }
.listen:hover, .listen[aria-pressed="true"] { background: var(--sign); color: var(--sign-ink); }
.rehook .listen { align-self: flex-start; color: #fff; border-color: rgba(255,255,255,.8); }
.rehook .listen:hover, .rehook .listen[aria-pressed="true"] { background: #fff; color: var(--red); }
.toast { min-height: 1.4em; text-align: center; color: var(--leaf); font-size: 15px; font-size: calc(var(--ts) * 15px); margin: 0; }
a { color: var(--sign); }
.foot { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--line); font-size: 14px; font-size: calc(var(--ts) * 14px); color: var(--muted); text-align: center; }

/* ---------- voice, radio and road additions ---------- */
/* CRT night: faint scanlines and a vignette over everything, never over the controls' readability */
body::after { content: ""; position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; z-index: 50;
  background: repeating-linear-gradient(to bottom, rgba(255,255,255,.022) 0 1px, transparent 1px 3px), radial-gradient(120% 90% at 50% 40%, transparent 60%, rgba(0,0,0,.35)); }
body.in-town .app { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }

.tag-voice { color: var(--fg); background: rgba(255,210,63,.14); border-radius: 99px; padding: 1px 8px; letter-spacing: .06em; text-transform: none; font-weight: 700; }
.district { display: flex; flex-direction: column; gap: 14px; }
.dname { margin: 10px 0 0 70px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; font-family: var(--font-sign); font-weight: 900; font-size: 14px; font-size: calc(var(--ts) * 14px); letter-spacing: .2em; text-transform: uppercase; color: var(--sign); }
.dname .lock { color: var(--muted); letter-spacing: .06em; text-transform: none; font-weight: 700; }
.stop.locked { opacity: .45; cursor: not-allowed; }
.stop.locked:hover .stop-card { transform: none; border-color: var(--line); }

.daily { text-align: left; display: grid; gap: 4px; background: linear-gradient(135deg, #1E2E57, var(--card)); border: 2px solid var(--sign); border-radius: 14px; padding: 14px 16px; box-shadow: 0 0 0 4px rgba(255,210,63,.08); }
.daily.done { border-color: var(--line); box-shadow: none; }
.daily-k { font-family: var(--font-sign); font-weight: 900; font-size: 14px; font-size: calc(var(--ts) * 14px); letter-spacing: .18em; text-transform: uppercase; color: var(--sign); }
.daily-t { font-family: var(--font-display); font-weight: 400; letter-spacing: .02em; font-size: 25px; font-size: calc(var(--ts) * 25px); line-height: 1.1; }
.daily-r { color: var(--muted); font-size: 16px; font-size: calc(var(--ts) * 16px); line-height: 1.35; }
.daily-go { font-family: var(--font-sign); font-weight: 700; font-size: 15px; font-size: calc(var(--ts) * 15px); color: var(--sign); margin-top: 4px; }

.radio-dial { position: relative; background: #0E1730; border: 1px solid var(--line); border-radius: 14px; padding: 10px 0 12px; overflow: hidden; }
.dial-head { display: flex; justify-content: space-between; gap: 12px; padding: 0 14px 8px; font-family: var(--font-num); font-size: 14px; font-size: calc(var(--ts) * 14px); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
#dial-now { color: var(--sign); text-align: right; }
.dial { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 50%; scrollbar-width: none; }
.dial::-webkit-scrollbar { display: none; }
.station { flex: none; scroll-snap-align: center; width: 92px; background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 8px 6px; color: var(--muted); display: grid; gap: 2px; text-align: center; }
.station b { font-family: var(--font-num); font-size: 19px; font-size: calc(var(--ts) * 19px); color: var(--fg); }
.station span { font-size: 14px; font-size: calc(var(--ts) * 14px); line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.station.tuned { border-color: var(--sign); color: var(--sign); background: rgba(255,210,63,.08); }
.station.tuned b { color: var(--sign); }
.needle { position: absolute; left: 50%; bottom: 0; top: 34px; width: 2px; margin-left: -1px; background: var(--red); box-shadow: 0 0 8px var(--red); pointer-events: none; }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode { text-align: left; display: grid; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.mode b { font-family: var(--font-sign); font-size: 15px; font-size: calc(var(--ts) * 15px); }
.mode span { color: var(--muted); font-size: 14px; font-size: calc(var(--ts) * 14px); line-height: 1.3; }
.mode.on { border-color: var(--leaf); box-shadow: inset 0 0 0 1px var(--leaf); }
.mode.on b::after { content: " · on"; color: var(--leaf); }
@media (max-width: 380px) { .modes { grid-template-columns: 1fr; } }

.challenge { background: rgba(230,57,70,.14); border: 1px solid var(--red); border-radius: 12px; padding: 10px 14px; font-weight: 700; text-align: center; }
.challenge .end-stars, .challenge span[aria-label] { font-size: 1em; letter-spacing: 1px; color: var(--sign); }
.challenge.daily-tag { background: rgba(255,210,63,.12); border-color: var(--sign); color: var(--sign); }
.voice-note { margin: 0; color: var(--muted); font-size: 16px; font-size: calc(var(--ts) * 16px); }
.voice-note b { color: var(--fg); }
.role { margin-left: 10px; padding: 2px 8px; border-radius: 99px; font-size: 14px; font-size: calc(var(--ts) * 14px); letter-spacing: .12em; }
.role-driver { background: var(--sign); color: var(--sign-ink); }
.role-navigator { background: var(--leaf); color: #0B1428; }
.or-tap { text-align: center; font-family: var(--font-sign); font-weight: 700; font-size: 14px; font-size: calc(var(--ts) * 14px); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.result .heard { color: var(--sign); font-style: italic; }
.nearmiss { text-align: center; font-family: var(--font-sign); font-weight: 900; color: var(--red); letter-spacing: .06em; animation: pop .5s cubic-bezier(.3,1.8,.5,1) both; }

/* the mic panel */
.micpanel { background: #0E1730; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.micpanel.cracked { border-color: var(--red); background-image: linear-gradient(115deg, transparent 47%, rgba(255,255,255,.18) 48%, transparent 49%), linear-gradient(60deg, transparent 63%, rgba(255,255,255,.12) 64%, transparent 65%); }
.mp-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--font-sign); font-weight: 900; font-size: 14px; font-size: calc(var(--ts) * 14px); letter-spacing: .14em; text-transform: uppercase; color: var(--leaf); }
.mp-cracks { font-family: var(--font-num); color: var(--red); letter-spacing: .3em; font-size: 17px; font-size: calc(var(--ts) * 17px); }
.mp-count { font-family: var(--font-num); color: var(--sign); font-size: 16px; font-size: calc(var(--ts) * 16px); letter-spacing: 0; }
.mp-count.over { color: var(--red); animation: shake .3s; }
.mp-line { margin: 0; font-size: 19px; font-size: calc(var(--ts) * 19px); font-weight: 700; }

.kid summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font: 700 18px var(--font-sign); font-size: calc(var(--ts) * 18px); color: var(--leaf); list-style: none; }
.kid summary::-webkit-details-marker { display: none; }
.kid summary::after { content: "＋"; margin-left: auto; color: var(--muted); }
.kid[open] summary::after { content: "－"; }
.kid p { margin: 0 0 10px; font-size: 19px; font-size: calc(var(--ts) * 19px); }
.kid .listen { margin-bottom: 12px; }
.howto-card { background: #0E1730; border: 2px dashed var(--sign); border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.howto-card b { font: 400 18px var(--font-display); color: var(--sign); }
.howto-card ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.howto-card li { display: flex; gap: 10px; align-items: center; font: 600 17px var(--font-sign); font-size: calc(var(--ts) * 17px); }
.howto-card li span { flex: none; width: 34px; height: 34px; display: grid; place-items: center; background: var(--card); border-radius: 10px; font-size: 18px; }
.verdict { font: 700 20px var(--font-sign); font-size: calc(var(--ts) * 20px); }
.v-g { color: var(--leaf); } .v-y { color: var(--sign); } .v-r { color: #FF9AA3; }
/* ---------- ignition + glovebox ---------- */
.ignition { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; padding-block: 10px 30px; }
.ign-line { margin: 0; font: 600 21px var(--font-sign); font-size: calc(var(--ts) * 21px); color: var(--fg); line-height: 1.3; }
.ignite { width: 210px; height: 210px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background: radial-gradient(circle at 35% 30%, #4A5678, #1B2133 70%); color: var(--fg); border: 6px solid var(--sign);
  box-shadow: 0 0 0 10px rgba(255,210,63,.12), 0 8px 0 #000, 0 0 50px rgba(255,210,63,.35); animation: pulse 1.6s ease-in-out infinite; }
.ignite .key { font-size: 54px; line-height: 1; transition: transform .25s; }
.ignite b { font: 400 22px var(--font-display); color: var(--sign); }
.ignite span:last-child { font: 600 15px var(--font-sign); color: var(--muted); }
.ignite:active { transform: translateY(5px); box-shadow: 0 0 0 10px rgba(255,210,63,.12), 0 3px 0 #000; }
.ignite:active .key { transform: rotate(80deg); }
.skipmap { background: none; border: 0; color: var(--muted); text-decoration: underline; font: 600 16px var(--font-sign); min-height: 44px; }
.howto-card.first { border-style: solid; }
.goal.mini { padding: 8px 12px; font-size: 16px; font-size: calc(var(--ts) * 16px); }
.howto-card.first span { color: var(--muted); font-size: 16px; }
.glovebox { display: flex; flex-direction: column; gap: 10px; }
.glovebox .dname { margin-left: 0; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.item { position: relative; text-align: left; display: flex; flex-direction: column; gap: 4px; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px 12px; min-height: 120px; box-shadow: 0 4px 0 var(--press); }
.item-i { font-size: 30px; line-height: 1; }
.item b { font: 700 16px var(--font-sign); font-size: calc(var(--ts) * 16px); }
.item span:not(.item-i) { color: var(--muted); font-size: 14px; font-size: calc(var(--ts) * 14px); line-height: 1.3; }
.item.on { border-color: var(--leaf); background: #1B3340; }
.item em { position: absolute; top: 8px; right: 10px; font: 700 12px var(--font-sign); font-style: normal; color: #0B1428; background: var(--leaf); border-radius: 99px; padding: 2px 8px; }
.item.locked { opacity: .5; box-shadow: none; }
.item:active:not(.locked) { transform: translateY(3px); box-shadow: 0 1px 0 var(--press); }
.item-on { background: rgba(123,211,137,.12); border: 1px solid var(--leaf); border-radius: 12px; padding: 8px 12px; font-size: 16px; }
.cjar.big { width: 96px; margin-left: -48px; }
.mp-hint { margin: 0; color: var(--sign); font: 600 16px var(--font-sign); }
@keyframes pulse { 50% { box-shadow: 0 0 0 18px rgba(255,210,63,.06), 0 8px 0 #000, 0 0 70px rgba(255,210,63,.45); } }
@media (prefers-reduced-motion: reduce) { .ignite { animation: none; } }
/* ---------- device punch-list ---------- */
.glove-news { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; background: linear-gradient(135deg, #1B3340, var(--card)); border: 2px solid var(--leaf); border-radius: 14px; padding: 12px 14px; animation: pop .5s cubic-bezier(.3,1.8,.5,1) both; }
.gn-i { font-size: 36px; line-height: 1; }
.gn-t { min-width: 0; font-size: 15px; font-size: calc(var(--ts) * 15px); color: var(--muted); line-height: 1.35; }
.gn-t b { display: block; color: var(--fg); font: 700 17px var(--font-sign); font-size: calc(var(--ts) * 17px); }
.gn-b { grid-column: 1 / -1; display: flex; gap: 10px; }
.gn-b .go { flex: 1; min-height: 48px; padding: 10px; }
.item .new { position: absolute; top: 8px; right: 10px; font: 700 12px var(--font-sign); font-style: normal; color: var(--sign-ink); background: var(--sign); border-radius: 99px; padding: 2px 8px; }
@media (max-width: 600px) { .zone { min-height: 120px; } .dragzone { gap: 8px; } }
@keyframes swing { 0% { transform: rotate(-9deg); opacity: 0; } 30% { opacity: 1; } 100% { transform: rotate(0); } }
@keyframes flicker { 0%, 92%, 100% { opacity: 1; } 93% { opacity: .35; } 95% { opacity: 1; } 96% { opacity: .5; } }
@keyframes rise { from { transform: translateY(8px); opacity: .0; } to { transform: none; opacity: 1; } }
@keyframes bump { 40% { transform: scale(1.25); } }
@keyframes drop { 40% { transform: translateY(4px); } }
@keyframes shake { 0% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 100% { transform: none; } }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script>
/* ---------- towns: one strange rule each, from the channel's idea bank ---------- */
const TOWNS = [
{
  id: "M1", track: "money", name: "Doubleton", rule: "every coin you save doubles at midnight.",
  hook: "So why does one kid here have a heavy jar… and his best friend has nothing?",
  meters: [{ k: "jar", label: "Coins in jar" }],
  init: () => ({ jar: Glove.has("piggy") ? 1 : 0, opened: false }),
  steps: [
    { when: "Day 1", text: "You find a shiny coin on the sidewalk. The candy shop is right there.",
      choices: [
        { t: "Drop it in your jar", fx: s => { s.jar += 1; }, say: "Clink. One lonely coin." },
        { t: "Buy a gumball", say: "Sweet! Gone in ten seconds." }],
      night: s => { const a = s.jar; s.jar *= 2; return a ? `Midnight. The jar glows. <strong>${a} → ${s.jar}</strong>` : "Midnight. The jar glows… but zero doubled is still zero."; } },
    { when: "Day 2", text: s => "Grandma slips you 1 coin. Then your friend sells cool stickers. 2 coins each.",
      enter: s => { s.jar += 1; },
      choices: [
        { t: "Keep saving", say: "You walk past the stickers. It stings a little." },
        { t: "Buy a sticker", cost: "−2", need: s => s.jar >= 2, fx: s => { s.jar -= 2; }, say: "It's a cool sticker. Your jar feels lighter." }],
      night: s => { const a = s.jar; s.jar *= 2; return `Midnight. <strong>${a} → ${s.jar}</strong>`; } },
    { rehook: "The jar only doubles if it stays CLOSED all day. Open it, and the magic skips a night." },
    { when: "Day 3", text: "Your big brother shakes the jar. “Open it! Let's count them!”",
      choices: [
        { t: "Keep it closed", fx: s => { s.opened = false; }, say: "“Later,” you say. He rolls his eyes." },
        { t: "Open it and count", fx: s => { s.opened = true; }, say: s => `${s.jar} coins! It feels great… for a minute.` }],
      night: s => { if (s.opened) return "Midnight. Nothing. The jar stays quiet."; const a = s.jar; s.jar *= 2; return `Midnight. <strong>${a} → ${s.jar}</strong>`; } },
    { when: "Day 4", text: "The fair is in town! The Ferris wheel costs 5 coins.",
      choices: [
        { t: "Watch from the ground", say: "The lights are pretty from down here too." },
        { t: "Ride the Ferris wheel", cost: "−5", need: s => s.jar >= 5, fx: s => { s.jar -= 5; s.opened = true; }, say: "Wheee! You had to open the jar to pay." }],
      night: s => { if (s.opened) return "Midnight. The jar was opened today. No magic."; const a = s.jar; s.jar *= 2; return `Midnight. <strong>${a} → ${s.jar}</strong>`; } },
    { when: "Day 5", text: "Your uncle visits and gives you 3 coins. A new comic book costs 4.",
      enter: s => { s.jar += 3; s.opened = false; },
      choices: [
        { t: "Save all of it", say: "Three more coins. Clink, clink, clink." },
        { t: "Buy the comic", cost: "−4", need: s => s.jar >= 4, fx: s => { s.jar -= 4; s.opened = true; }, say: "Great comic. You read it twice. The jar was opened." }],
      night: s => { if (s.opened) return "Midnight. The jar was opened today. No magic."; const a = s.jar; s.jar *= 2; return `Midnight. <strong>${a} → ${s.jar}</strong>`; } },
    { when: "Day 6", text: "Your friend forgot his lunch money. He looks really hungry.",
      enter: s => { s.opened = false; },
      choices: [
        { t: "Share half your sandwich", say: "He grins. “Best sandwich ever.” The jar stays shut." },
        { t: "Open the jar and give him 5 coins", cost: "−5", need: s => s.jar >= 5, fx: s => { s.jar -= 5; s.opened = true; }, say: "Kind! But opening the jar costs a night." }],
      night: s => { if (s.opened) return "Midnight. The jar was opened today. No magic."; const a = s.jar; s.jar *= 2; return `Midnight. <strong>${a} → ${s.jar}</strong>`; } },
    { when: "Day 7", text: "The toy store has a remote-control car. 15 coins. Last one on the shelf!",
      enter: s => { s.opened = false; },
      choices: [
        { t: "Walk away. Keep saving", say: "“Last one” is what they always say." },
        { t: "Buy the car", cost: "−15", need: s => s.jar >= 15, fx: s => { s.jar -= 15; s.opened = true; }, say: "Vroom! It's fast. The jar feels empty." }],
      night: s => { if (s.opened) return "Midnight. No magic tonight."; const a = s.jar; s.jar *= 2; return `Midnight. <strong>${a} → ${s.jar}</strong>`; } },
  ],
  rate: s => s.jar >= 100 ? 3 : s.jar >= 30 ? 2 : 1,
  ending: s => s.jar >= 100 ? `${s.jar} coins. And it started with one coin on the sidewalk.` : s.jar >= 30 ? `${s.jar} coins. Good! But every time you opened the jar, it cost you a night.` : `${s.jar} coins. The fun stuff was fun. The jar stayed small.`,
  lesson: "Savings grow best when you leave them alone.",
  cta: "So… would YOU have opened the jar?"
},
{
  id: "L1", track: "life", name: "Hushwick", rule: "you only get 10 words a day.",
  reel: "This is Rule Road radio, live from Hushwick, where you only get ten words a day. Here's how our traveler spent theirs.",
  hook: "So why is one kid saving her words like they're gold?",
  meters: [{ k: "words", label: "Words left", max: 10 }, { k: "heart", label: "Friendship", life: true }],
  init: () => ({ words: 10, heart: 0 }),
  steps: [
    { when: "7:00 a.m.", text: "Mom made you breakfast before work.",
      choices: [
        { t: "“Thank you, Mom!”", w: 3, h: 1, say: "She smiles all the way to the bus." },
        { t: "(Just nod)", w: 0, h: 0, say: "She nods back. A quiet morning." },
        { t: "“Eggs AGAIN? I wanted pancakes.”", w: 5, h: -1, say: "Her smile drops. Five words, gone." }] },
    { when: "8:15 a.m.", text: "On the bus, your friend Mia looks like she's been crying.",
      choices: [
        { t: "“Are you okay?”", w: 3, h: 2, say: "She tells you everything. You just listen." },
        { t: "(Sit close to her)", w: 0, h: 1, say: "You sit close. It helps a little." },
        { t: "“Cheer up, it's no big deal.”", w: 6, h: -1, say: "She turns to the window. Six words that didn't help." }] },
    { rehook: "At 8 p.m., Grandpa calls from far away. He calls every night. You'll want words left for him." },
    { when: "12:30 p.m.", text: "A kid laughs at your shoes in front of everyone.",

        { t: "“Your shoes are worse. And your haircut.”", w: 7, h: -2, say: "Everyone goes “Ooooh.” You feel worse, not better." },

    { when: "2:00 p.m.", text: "Your teacher asks who can explain the answer: 3 × 4.",

        { t: "“It's twelve. Three groups of four.”", w: 6, h: 1, say: "Gold star! But that cost six words." },
        { t: "(Walk up and draw it on the board)", w: 0, h: 1, say: "Three circles, four dots each. Same gold star. Zero words." }] },
    { when: "10:00 a.m.", text: "Your little sister drew you a picture. It's… a purple blob.",

        { t: "“It's beautiful!”", w: 2, h: 2, say: "She hugs your leg and won't let go." },
        { t: "(Hug her and tape it to your locker)", w: 0, h: 2, say: "No words needed. She skips away." },
        { t: "“What even is that?”", w: 4, h: -1, say: "Her lip wobbles. Four words, wasted." }] },
    { when: "4:00 p.m.", text: "At practice, the coach shouts: “Who wants to lead warm-ups?”",

        { t: "“Me!”", w: 1, h: 1, say: "One word. The whole team follows you." },
        { t: "(Raise your hand high)", w: 0, h: 1, say: "Coach points at you. Zero words." },
        { t: "“Not me, pick someone else.”", w: 5, h: 0, say: "Five words to say no. Yikes." }] },
    { when: "6:00 p.m.", text: "Dad burned dinner. He looks really sad about it.",
      choices: [
        { t: "“Still yummy, Dad.”", w: 3, h: 2, say: "He laughs. “Liar.” But he's smiling." },
        { t: "(Eat it with a big thumbs up)", w: 0, h: 2, say: "Crunchy. He ruffles your hair." },
        { t: "“Gross! Can we order pizza?”", w: 5, h: -2, say: "He puts his fork down. The kitchen gets quiet." }] },

  lesson: "Fewer words, chosen well, say the most.",

{

{
  id: "L2", track: "life", name: "Saidsville", rule: "whatever you say about someone comes true for one hour.",

const dirOf = (T, k) => { const K = kidOf(T); return K && K.up && K.up.indexOf(k) >= 0 ? "up" : K && K.down && K.down.indexOf(k) >= 0 ? "down" : ""; };

/* ---------- voice-town helpers (Rhymeburg deals, Echo Valley promises, talk-back Hushwick) ---------- */
function rhymeDeal(r, s, target, cheap, full) {
  const text = r.text, T = target.toUpperCase();
  if (Talk.has(text, ["skip", "no thanks", "pass", "never mind"])) return { t: `“${text}”`, heard: text, say: "You keep walking. Coins safe." };
  if (Talk.rhymes(text, target)) {
    if (s.coins < cheap) return { t: `“${text}”`, heard: text, say: "Great rhyme. Empty pockets." };
    return { t: `“${text}”`, heard: text, fx: s => { s.coins -= cheap; s.stuff += 1; }, say: `It rhymes with ${T}! “Deal,” says the seller. Just ${cheap} coin${cheap > 1 ? "s" : ""}.` };
  }
  const price = full + s.miss;
  if (s.coins < price) return { t: `“${text}”`, heard: text, fx: s => { s.miss += 1; }, say: `That doesn't rhyme with ${T}, and you can't pay ${price}. The seller turns away.` };
  return { t: `“${text}”`, heard: text, fx: s => { s.coins -= price; s.stuff += 1; s.miss += 1; }, say: `That doesn't rhyme with ${T}. Full price: ${price} coins.` };
}

// Tillsbury: argue with your wallet out loud; buy words spend, no words save, mumbles count as no
function walletTalk(r, s) {
  const st = TOWNS[S.t].steps[S.step], buy = st.choices.find(c => c.clip === "w-ouch"), keep = st.choices.find(c => c.clip === "w-purr");
  if (Talk.has(r.text, ["buy", "yes", "want", "take", "mine", "need", "deal", "grab", "treat", "whatever"]) && !Talk.has(r.text, ["no", "not", "don't", "won't"])) return { ...buy, t: `“${r.text}”`, heard: r.text };
  if (Talk.has(r.text, ["no", "nope", "fine", "okay", "ok", "walk", "leave", "won't", "don't", "skip", "pass", "right", "sorry", "save"])) return { ...keep, t: `“${r.text}”`, heard: r.text };
  return { ...keep, t: `“${r.text}”`, heard: r.text, clip: "w-huh" };
}

function echo(s, text, weight) { s.echo.push({ text, weight }); }
function echoWeight(text) {
  if (Talk.has(text, ["forever", "always", "every", "everything", "anything", "promise", "hundred", "never", "whole", "all"])) return 3;
  if (Talk.has(text, ["maybe", "try", "might", "if", "someday", "sometimes", "think", "perhaps"])) return 0;
  return 1;
}
function echoSay(r, s) {
  const w = echoWeight(r.text);
  return { t: `“${r.text}”`, heard: r.text, fx: s => echo(s, r.text, w),
    say: w === 3 ? "Big words. The valley writes them down in pen." : w === 0 ? "Careful words. The valley barely hears them." : "The valley writes it down." };
}
const echoText = (s, i) => (s.echo[i] || { text: "…" }).text;
const echoCost = (s, i) => ({ 0: 1, 1: 3, 3: 6 })[(s.echo[i] || { weight: 0 }).weight] || 3; // hours a promise takes to keep
const echoKept = (s, i, plain) => (s.echo[i] || {}).weight === 3 ? `A promise that big takes ${echoCost(s, i)} hours. You keep it, barely.` : plain;

// Hushwick talk-back: say your answer out loud; every spoken word costs one of your 10
const HUSH = [
  { kind: ["thank", "thanks", "love", "yummy", "delicious", "great", "best"], mean: ["again", "ugh", "pancakes", "gross", "hate", "boring"], kh: 1, ks: "She smiles all the way to the bus.", mh: -1, ms: "Her smile drops.", ps: "She nods, a little confused." },
  { kind: ["okay", "ok", "alright", "help", "hug", "sorry", "listen", "here"], mean: ["cheer", "deal", "whatever", "stop", "baby"], kh: 2, ks: "She tells you everything. You just listen.", mh: -1, ms: "She turns to the window.", ps: "She shrugs and looks out the window." },
  { kind: ["nice", "try", "thanks", "cool", "funny", "okay"], mean: ["ugly", "worse", "stupid", "dumb", "haircut", "shut", "loser"], kh: 1, ks: "He shrugs. It's over.", mh: -2, ms: "Everyone goes “Ooooh.” You feel worse, not better.", ps: "He blinks. It's over." },
  { kind: ["twelve", "12", "groups", "four", "three"], mean: [], kh: 1, ks: "Gold star!", mh: 0, ms: "", ps: "The teacher waits… then calls on someone else." },
  { kind: ["beautiful", "love", "amazing", "pretty", "awesome", "wow", "great", "cool", "best"], mean: ["weird", "ugly", "blob", "gross"], kh: 2, ks: "She hugs your leg and won't let go.", mh: -1, ms: "Her lip wobbles.", ps: "She tilts her head, then skips away." },
  { kind: ["me", "i", "yes", "mine"], mean: ["not", "no", "someone"], kh: 1, ks: "The whole team follows you.", mh: 0, ms: "Coach picks someone else.", ps: "Coach squints at you, then picks someone else." },
  { kind: ["yummy", "good", "love", "thanks", "thank", "great", "delicious", "tasty"], mean: ["gross", "pizza", "burnt", "yuck", "disgusting", "ew"], kh: 2, ks: "He laughs. “Liar.” But he's smiling.", mh: -2, ms: "He puts his fork down. The kitchen gets quiet.", ps: "He nods and keeps eating." },
  { kind: ["love", "miss", "goodnight", "night", "thanks", "thank", "grandpa"], mean: ["busy", "bye", "later"], kh: 3, ks: "He goes quiet. Then: “That made my whole week.”", mh: 0, ms: "“Oh. Okay, kiddo.” Click.", ps: "He chuckles. “Love you too, kiddo.”" },
];
function hushResolve(L, st) {
  return (r, s) => {
    const n = Talk.words(r.text).length;
    if (!n) return Math.max(0, st.choices.findIndex(c => c.w === 0));
    const kind = Talk.has(r.text, L.kind), mean = !kind && Talk.has(r.text, L.mean);
    let h = kind ? L.kh : mean ? L.mh : 0, say = kind ? L.ks : mean ? L.ms : L.ps, w = n;
    if (n > s.words) { w = s.words; h = Math.min(h, 0) - 1; say = `Your voice cuts out after ${s.words === 1 ? "one word" : s.words + " words"}. The rest just… vanishes.`; }
    return { t: `“${r.text}”`, heard: r.text, w, h, say };
  };
}
(function talkBackHushwick() {
  const T = TOWNS.find(t => t.id === "L1");
  if (!T) return;
  T.voice = "speech";
  let k = 0;
  T.steps.forEach(st => {
    if (st.rehook || !HUSH[k]) return;
    st.mic = { kind: "speech", words: true, line: "Say your answer out loud. Every word you say costs one.", resolve: hushResolve(HUSH[k++], st) };
  });
})();

/* ---------- tiny synth: plucks, a drone for the catch, a swell for the lesson ---------- */
const Sound = {
  ctx: null, on: store.get("sound", true),
  init() { iosAudio.unlock(); if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { this.ctx = null; } } if (this.ctx && this.ctx.state === "suspended" && this.ctx.resume) quiet(this.ctx.resume()); },
  tone(f, d = .25, type = "triangle", v = .14, when = 0) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    chain(o, g, c.destination); o.start(t); o.stop(t + d + .05);
  },
  pluck() { this.tone(660, .18); this.tone(990, .14, "sine", .06, .03); },
  good() { [784, 988, 1319].forEach((f, i) => this.tone(f, .3, "sine", .1, i * .07)); },
  bad() { this.tone(180, .35, "sawtooth", .07); this.tone(140, .4, "sine", .1, .05); },
  drone() { this.tone(73, 1.4, "sawtooth", .06); this.tone(110, 1.4, "sine", .08); },
  swell() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 1.2, "sine", .07, i * .12)); },
  static() { // a short burst of radio static for the tuning dial
    if (!this.on || !this.ctx) return;
    const c = this.ctx, n = c.createBuffer(1, c.sampleRate * 0.12, c.sampleRate), ch = n.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
    const s = c.createBufferSource(), g = c.createGain(); s.buffer = n; g.gain.value = 0.04; chain(s, g, c.destination); s.start();
  },
};

/* ---------- narrator: the Street Anomaly host, pre-recorded in the channel's voice (/voice/<key>.mp3) ---------- */
const Voice = {
  on: true, key: null, el: null,
  init() { try { this.on = localStorage.getItem("rule-road-voice") !== "off"; } catch {} },
  save() { try { localStorage.setItem("rule-road-voice", this.on ? "on" : "off"); } catch {} },
  say(key, force) {
    if (!this.on && !force) return;
    if (!this.el) {
      this.el = new Audio(); this.el.preload = "auto";
      ["play", "pause", "ended"].forEach(ev => this.el.addEventListener(ev, () => this.paint()));
    }
    this.key = key; this.el.src = `/voice/${key}.mp3`;
    const p = this.el.play(); if (p && p.catch) p.catch(() => { this.key = null; this.paint(); });
  },
  stop() { if (this.el && !this.el.paused) this.el.pause(); this.key = null; this.paint(); },
  playing(key) { return !!(this.el && !this.el.paused && !this.el.ended && this.key === key); },
  paint() {
    document.querySelectorAll('[data-act="say"]').forEach(b => { const on = this.playing(b.dataset.k); b.textContent = on ? "■ Stop" : "▶ Listen"; b.setAttribute("aria-pressed", on); });
    const dsh = document.querySelector(".dash"); if (dsh) dsh.classList.toggle("on-air", !!(this.el && !this.el.paused && !this.el.ended));
  },
};

    <div class="row">
      <button class="go ghost" data-act="again">Play ${T.name} again</button>
      ${nxt !== undefined ? `<button class="go" data-act="town" data-i="${nxt}">Next town →</button>` : `<button class="go" data-act="fan">Make your own town →</button>`}
    </div>
    ${installCard()}`;
  }
  const st = T.steps[S.step];
  if (st.rehook) {
    return `${topbar(true)}
    <div class="mini-sign">${T.name} · ${tagLabel}</div>
    ${meters(T, s)}${stage(T, s)}
    <div class="rehook"><div class="k">But here's the part nobody tells you…</div><p>${esc(st.rehook)}</p>${listenBtn(T.id + "-catch")}</div>
    <button class="go" data-act="next">Keep going</button>`;
  }
  const r = S.phase === "result" ? S.lastResult : null;
  const showMic = st.mic && !r;
  const choices = st.choices.map((c, i) => {
    const words = c.w !== undefined;
    const lockedToMic = micOnly(st, c);
    const ok = !lockedToMic && (c.need ? c.need(s) : (words ? s.words >= c.w : true));
    const cl = val(c.cost, s);
    const cost = lockedToMic ? "use the mic" : words ? (c.w ? `${c.w} word${c.w > 1 ? "s" : ""}` : "0 words") : (cl ? (/[a-z]$/i.test(cl) ? cl : `${cl} coins`) : "");
    return `<button class="choice" data-act="pick" data-c="${i}" ${ok && !r ? "" : "disabled"} ${r && r.i === i ? 'style="border-color:var(--sign);opacity:1"' : ""}>
      <span>${esc(c.t)}</span>${cost ? `<span class="cost">${ok || lockedToMic ? cost : "not enough"}</span>` : ""}
    </button>`;
  }).join("");
  const who = Prefs.coop ? role(T, S.step) : null;
  return `${topbar(true)}
  <div class="mini-sign">${T.name} · ${tagLabel}</div>
  ${meters(T, s)}${stage(T, s)}
  ${S.firstRide && !r && kidOf(T) ? `<div class="goal mini">⭐⭐⭐ ${esc(kidOf(T).goal)}</div>` : ""}
  <section class="scene" ${r ? 'style="animation:none"' : ""}>
    <div class="when">${esc(st.when)}${who ? `<span class="role role-${who.toLowerCase()}">${who}</span>` : ""}</div>
    <p class="story">${esc(val(st.text, s))}</p>
    ${showMic ? micPanel(st) : ""}
    ${showMic ? `<div class="or-tap">or tap</div>` : ""}
    ${st.drag && !r ? dragPanel(st) + `<div class="or-tap">or tap</div>` : ""}
    ${st.play && st.play.kind === "catch" && !S.played && !r ? "" : `<div class="choices">${choices}</div>`}
    ${S.firstRide && !store.get("howto", false) && !r ? `<div class="howto-card first"><b>👆 Tap A or B to choose</b><span>Then watch your numbers change. Green arrows show which way is good.</span><button class="go ghost" data-act="howto-ok">Got it</button></div>` : ""}
    ${r ? `<div class="result">${S.grid.length ? `<p class="verdict v-${S.grid[S.grid.length - 1]}">${{ g: "👍 Nice choice!", y: "🤔 Okay…", r: "😬 Uh-oh!" }[S.grid[S.grid.length - 1]]}</p>` : ""}${r.heard ? `<p class="heard">You said: “${esc(r.heard)}”</p>` : ""}<p>${esc(r.say)}</p>${r.night ? `<p class="night">${r.night}</p>` : ""}</div>
      <button class="go" data-act="next">${S.step + 1 < T.steps.length ? (Prefs.coop && nextRole() && nextRole() !== role(T, S.step) ? `Pass the phone to the ${nextRole()} →` : "Next") : "See how it ended"}</button>` : ""}
  </section>`;
}

/* fan rule maker */
function renderFan() {
  const rule = S.fan.rule.trim(), lesson = S.fan.lesson.trim();
  const shown = rule || "every chore you do adds a brick to your own house.";
  const copy = `My Rule Road town 🏙️\nIn this town, ${shown}${lesson ? `\nLesson: ${lesson}` : ""}\nCould you live here? streetanomaly.pages.dev`;
  return `${topbar(true)}
  <section class="hero">
    <div class="sign"><div class="sign-inner">
      <div class="kicker">Your town · Mile ${TOWNS.length + 1}</div>
      <div class="rule" id="fanSign">In this town, ${esc(shown)}</div>
    </div></div>
    <div class="pole"></div>
  </section>
  <img class="tape" src="/img/tape.jpg" width="360" height="332" alt="" aria-hidden="true">
  <div class="field"><label for="fanRule">In this town…</label>
    <input id="fanRule" maxlength="90" placeholder="every chore you do adds a brick to your own house." value="${esc(S.fan.rule)}"></div>
  <div class="field"><label for="fanLesson">What does it teach? (optional)</label>
    <input id="fanLesson" maxlength="60" placeholder="Earning takes effort" value="${esc(S.fan.lesson)}"></div>
  <div class="copybox" id="copyText">${esc(copy)}</div>
  <div class="row">
    <button class="go ghost" data-act="copy">Copy my rule</button>
    <button class="go" data-act="sharefan">Dare a friend →</button>
  </div>
  <p class="toast" id="toast" aria-live="polite"></p>
  <p class="howto">Send your rule to a friend and ask them one question: would you survive a day in your town?</p>`;
}

function render() {
  document.body.classList.toggle("party", Prefs.party);
  document.body.classList.toggle("in-town", S.screen === "town");
  $app.innerHTML = (S.screen === "ignition" ? renderIgnition() : S.screen === "home" ? renderHome() : S.screen === "fan" ? renderFan() : renderTown()) + dash();
  if (S.screen === "fan") bindFan();
  if (S.screen === "home") bindDial();
  Play.mount();
  const st = MicRun.step(); if (st && st.mic && !MicRun.done) MicRun.draw(st); // show the red line / target band before the first word
}

function animateMeters(before) {
  if (!before) return;
  document.querySelectorAll(".mv").forEach(el => {
    const k = el.dataset.k, a = before[k], b = S.s[k];
    if (a === undefined || a === b) return;
    el.classList.add(b > a ? "bump" : "drop");
  });
}

function enterStep() {
  const st = TOWNS[S.t].steps[S.step];
  S.played = false;
  if (st && st.enter && !st.rehook) st.enter(S.s);
  if (st && st.rehook) { Sound.drone(); Voice.say(TOWNS[S.t].id + "-catch"); }
  else if (st && st.clip) Voice.say(TOWNS[S.t].id + "-" + st.clip);
  if (st && st.mic) micEnter();
}

// a choice was made: by tap (i), or by voice (dyn = a choice built from what was said or how it sounded)
function pick(i, dyn, before0) {
  const T = TOWNS[S.t], st = T.steps[S.step], c = dyn || st.choices[i], s = S.s;
  const before = before0 || { ...s };
  if (c.w !== undefined) { s.words -= c.w; s.heart += c.h || 0; }
  if (c.water !== undefined) {
    if (c.water) { s.streak += 1; s.coins += s.streak; } else { s.coins = Math.floor(s.coins / 2); s.streak = 0; }
  }
  if (c.fx) c.fx(s);
  Play.after(T, before, s);
  if (s.bat !== undefined) s.bat = Math.max(0, Math.min(100, s.bat));
  if (s.glass !== undefined) s.glass = Math.max(0, Math.min(100, s.glass));
  const night = st.night ? st.night(s) : (c.water !== undefined ? (c.water ? `The tree grows <strong>+${s.streak}</strong> coins.` : (before.coins ? `Skipped. The tree drops half: <strong>${before.coins} → ${s.coins}</strong>` : "Skipped. Nothing grows.")) : "");
  S.lastResult = { i: dyn ? -1 : i, say: val(c.say, s), night, heard: c.heard || "" };
  if (c.heard) S.heard.push(c.heard);
  if (c.clip) Voice.say(T.id + "-" + c.clip);
  S.phase = "result";
  // was that choice good? each number counts in its good direction (KID up/down); towns without one count "up" as good
  const score = T.meters.reduce((sum, m) => {
    const diff = s[m.k] - before[m.k]; if (!diff || typeof diff !== "number") return sum;
    const d = dirOf(T, m.k), w = d === "down" ? -1 : d === "up" || !kidOf(T) ? 1 : 0;
    return sum + Math.sign(diff) * w;
  }, 0);
  S.grid.push(score < 0 ? "r" : score > 0 ? "g" : "y");
  score < 0 ? Sound.bad() : score > 0 ? Sound.good() : Sound.pluck();
  render(); animateMeters(before); Juice.meters(T, before, s);
}

// a voice challenge finished: turn it into a choice
function onMicResult(res) {
  const T = TOWNS[S.t], st = T.steps[S.step], s = S.s, m = st.mic;
  const before = { ...s };
  let out;
  if (m.resolve) out = m.resolve(res, s);
  else if (m.kind === "calibrate") out = 0;
  else {
    out = res.ok ? st.choices.findIndex(c => c.mic) : st.choices.findIndex(c => !c.mic);
    if (m.kind === "whisper" && res.ok && res.cracks && m.cost) s.glass -= res.cracks * m.cost; // small slips still chip the glass
  }
  // a whisper that got across with a slip or two: same choice, honest words
  if (typeof out === "number" && m.kind === "whisper" && res.ok && res.cracks) {
    const c = st.choices[out];
    out = { ...c, say: `${res.cracks === 1 ? "One crack" : res.cracks + " cracks"} under your feet… but you made it. ${val(c.say, s).replace(/^Not a single crack\. /, "")}` };
  }
  if (typeof out === "number") pick(Math.max(0, out), null, before);
  else pick(-1, out, before);
}

function next() {
  const T = TOWNS[S.t];
  Sound.pluck(); Voice.stop(); Reel.stop(); Play.stop();
  if (S.step + 1 >= T.steps.length) {
    const was = totalStars();
    S.phase = "end"; S.res = T.rate(S.s);
    if ((S.stars[T.id] || 0) < S.res) { S.stars[T.id] = S.res; saveStars(S.stars); }
    S.dailyJust = S.t === dailyTown() && markDaily();
    S.opened = DISTRICTS.filter(d => d.need > was && d.need <= totalStars()).map(d => d.name);
    store.set("seen", true);
    Sound.swell(); render(); Voice.say(T.id + "-end");
    if (S.opened && S.opened.length) { Juice.burst(document.querySelector(".unlock"), 12, "money"); Sound.swell(); }
    if (S.res === 3) Juice.burst(document.querySelector(".end-stars"), 14, "money");
    else if (nearMiss(T, S.s)) Juice.buzz([20, 40, 20, 40, 60]);
    return;
  }
  S.step += 1; S.phase = "step"; enterStep(); render();
}

function startTown(i, opts = {}) {
  if (!districtOpen(districtOf(i)) && !opts.free) { Juice.penalty(); return; }
  MicRun.reset(); Reel.stop(); Play.stop(); Play.mem = {};
  S.screen = "town"; S.t = i; S.step = 0; S.phase = "arrive"; S.s = TOWNS[i].init(); S.lastResult = null;
  S.firstRide = false; S.reel = []; S.grid = []; S.heard = []; S.ghostOut = null; S.base = 0; S.dailyJust = false; S.daily = !!opts.daily;
  render(); window.scrollTo(0, 0); Voice.say(TOWNS[i].id + "-arrive");
}

function bindFan() {
  const r = document.getElementById("fanRule"), l = document.getElementById("fanLesson");
  const upd = () => {
    S.fan.rule = r.value; S.fan.lesson = l.value;
    const shown = S.fan.rule.trim() || "every chore you do adds a brick to your own house.";
    document.getElementById("fanSign").textContent = "In this town, " + shown;
    document.getElementById("copyText").textContent = `My Rule Road town 🏙️\nIn this town, ${shown}${S.fan.lesson.trim() ? `\nLesson: ${S.fan.lesson.trim()}` : ""}\nCould you live here? streetanomaly.pages.dev`;
  };
  r.addEventListener("input", upd); l.addEventListener("input", upd);
}

// the tuning dial: scroll the stations under the needle; a crackle at each new station
function bindDial() {
  const d = document.getElementById("dial"), now = document.getElementById("dial-now"); if (!d) return;
  let last = -1;
  const tuned = () => {
    const mid = d.getBoundingClientRect().left + d.clientWidth / 2;
    let best = null, bd = 1e9;
    d.querySelectorAll(".station").forEach(b => { const r = b.getBoundingClientRect(), dd = Math.abs(r.left + r.width / 2 - mid); if (dd < bd) { bd = dd; best = b; } });
    if (!best) return;
    const i = +best.dataset.i;
    d.querySelectorAll(".station").forEach(b => b.classList.toggle("tuned", b === best));
    if (i !== last) { last = i; Sound.static(); now.textContent = `${freq(roadPos(i))} FM · ${TOWNS[i].name}`; }
  };
  d.addEventListener("scroll", () => requestAnimationFrame(tuned), { passive: true });
  tuned();
}

$app.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "install") { if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } return; }
  if (act === "hideinstall") { installHidden = true; try { localStorage.setItem("rule-road-install-hidden", "1"); } catch {} render(); return; }
  if (act === "say") { const k = b.dataset.k; Voice.playing(k) ? Voice.stop() : Voice.say(k, true); return; }
  if (act === "ignite") { ignite(); return; }
  if (act === "equip-new") { const id = b.dataset.id; if (Glove.on.indexOf(id) < 0) Glove.toggle(id); Glove.markSeen(Glove.fresh().map(x => x.id)); Juice.burst(b, 8, "money"); Sound.good(); render(); return; }
  if (act === "glove-later") { Glove.markSeen(Glove.fresh().map(x => x.id)); Juice.tap(); render(); return; }
  if (act === "equip") { const it = ITEMS.find(x => x.id === b.dataset.id); if (!it || !Glove.open(it)) { Juice.penalty(); return; } Glove.toggle(it.id); Glove.markSeen([it.id]); Juice.tap(); Sound.pluck(); render(); return; }
  if (act === "howto-ok") { store.set("howto", true); Juice.tap(); render(); return; }
  if (act === "tsize") { TS.i = (TS.i + 1) % 3; store.set("ts", TS.i); TS.apply(); Juice.tap(); render(); return; }
  if (act === "voice") { Voice.on = !Voice.on; Voice.save(); if (!Voice.on) Voice.stop(); render(); return; }
  if (act === "sound") { Sound.on = !Sound.on; store.set("sound", Sound.on); Sound.init(); if (Sound.on) Sound.pluck(); render(); return; }
  Sound.init();
  if (act === "home") { MicRun.reset(); Reel.stop(); S.screen = "home"; Sound.pluck(); Voice.stop(); render(); window.scrollTo(0, 0); }
  else if (act === "town") { Sound.pluck(); startTown(+b.dataset.i, { free: S.screen === "town" }); }
  else if (act === "tune") {
    const i = +b.dataset.i;
    if (!b.classList.contains("tuned")) { b.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" }); return; }
    Sound.pluck(); startTown(i);
  }
  else if (act === "daily") { Sound.pluck(); startTown(dailyTown(), { free: true, daily: true }); }
  else if (act === "again") { Sound.pluck(); startTown(S.t, { free: true, daily: S.daily }); }
  else if (act === "begin") { Voice.stop(); S.phase = "step"; S.step = 0; enterStep(); Sound.pluck(); render(); }
  else if (act === "pick") { Juice.tap(); pick(+b.dataset.c); }
  else if (act === "next") { next(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  else if (act === "fan") { S.screen = "fan"; Sound.pluck(); render(); window.scrollTo(0, 0); Voice.say("fan"); }
  else if (act === "coop") { Prefs.coop = !Prefs.coop; Prefs.save(); Sound.pluck(); render(); }
  else if (act === "party") { Prefs.party = !Prefs.party; Prefs.save(); Sound.pluck(); render(); }
  else if (act === "reel") Reel.play(TOWNS[S.t], false);
  else if (act === "reelsave") Reel.play(TOWNS[S.t], true);
  else if (act === "share") {
    const a = document.getElementById("alias"); if (a) { Prefs.name = a.value.trim().slice(0, 20); Prefs.save(); }
    shareResult(TOWNS[S.t], S.res);
  }
  else if (act === "sharefan") {
    const txt = document.getElementById("copyText").textContent;
    try { if (navigator.share) { await navigator.share({ text: txt }); return; } } catch (err) { if (err && err.name === "AbortError") return; }
    b.closest(".row").querySelector('[data-act="copy"]').click();
  }
  else if (act === "copy") {
    const txt = document.getElementById("copyText").textContent, toast = document.getElementById("toast");
    const fallback = () => { const sel = window.getSelection(), rg = document.createRange(); rg.selectNodeContents(document.getElementById("copyText")); sel.removeAllRanges(); sel.addRange(rg); toast.textContent = "Selected. Press copy on your keyboard."; };
    try { navigator.clipboard.writeText(txt).then(() => { toast.textContent = "Copied. Send it to a friend."; }, fallback); } catch { fallback(); }
  }
});

/* first stop: a challenge link opens that town; a first-time visitor drops straight into Mile 1; everyone else sees the road */
function start() {
  S.challenge = readChallenge();
  if (S.challenge) return startTown(S.challenge.t, { free: true });
  if (!store.get("seen", false) && !Object.keys(S.stars).length) { S.screen = "ignition"; return render(); }
  render();
}
start();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
